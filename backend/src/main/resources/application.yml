spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ai_bookstore}
    username: ${DB_USER:bookstore}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
