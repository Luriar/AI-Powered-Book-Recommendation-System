<!DOCTYPE html>
<html lang="ko"> <!-- 기본 언어는 한국어 -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />
    <title>AI 온라인 서점</title>

    <!-- ⛔︎ Edge/Chrome 브라우저 번역 막대 차단 → 파란 막대 안 뜸 -->
    <meta name="google" content="notranslate">

    <!-- ↓ 우리가 넣은 CSS(iframe·툴팁 숨기기)는 그대로 둠 -->
    <style id="hide-gtranslate">
      .goog-te-banner-frame.skiptranslate,
      #goog-gt-tt,
      .VIpgJd-ZVi9od-aZ2wEe-wOHMyf,
      .VIpgJd-ZVi9od-xl07Ob-OEVmcd { display:none!important; }
      html,body{top:0!important;}
    </style>
  </head>
  <body>
    <!-- ✅ 숨겨진 Google 번역 위젯 (실제 드롭다운은 이 안에 생성됨) -->
    <div id="google_translate_element"
     style="position:fixed;top:-9999px;left:-9999px;width:0;height:0;overflow:hidden;"></div>
    <div id="app"></div>
    <!-- ✅ Google 번역 초기화 스크립트 -->
    <script>
    function googleTranslateElementInit () {
      new google.translate.TranslateElement({
        pageLanguage : 'ko',
        includedLanguages : 'ko,en,zh-CN',
        layout : google.translate.TranslateElement.InlineLayout.SIMPLE,
        /*   ↓ 브라우저가 번역 제안 배너 띄우지 않게 함 */
        autoDisplay : false
      }, 'google_translate_element');
    }
    </script>

    <!-- ✅ Google 번역 SDK 로드 -->
    <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <!-- ✅ Vite 앱 진입 스크립트 -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
